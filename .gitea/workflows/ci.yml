name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Saturday 05:00 UTC: 06:00 in Paris in winter, 07:00 in summer (Gitea runs cron in UTC).
    - cron: "0 5 * * 6"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get shared actions
        uses: actions/checkout@v7
        with:
          repository: labeex/cicdeex
          ref: 1.1.0
          token: ${{ secrets.CICDEEX_TOKEN }}
          path: .cicdeex
          persist-credentials: false

      - name: Scan for secrets
        uses: ./.cicdeex/secret-scan

      - name: Lint Dockerfile with hadolint
        uses: ./.cicdeex/hadolint

      - name: Build Docker image
        run: docker build -t socat-proxy:ci .

      - name: Smoke test (syntax check)
        run: docker run --rm --entrypoint sh socat-proxy:ci -n /entrypoint.sh

      - name: Run unit tests
        run: |
          docker build --target test -t socat-proxy:test .
          docker run --rm socat-proxy:test bats /app/tests/entrypoint.bats

      - name: Lint entrypoint.sh with shellcheck
        run: docker build --target lint -t socat-proxy:lint .

      - name: Scan with Trivy (critical - blocking)
        id: trivy_critical
        continue-on-error: true
        uses: ./.cicdeex/trivy
        with:
          image: socat-proxy:ci

      - name: Handle CRITICAL findings
        if: steps.trivy_critical.outcome == 'failure'
        uses: ./.cicdeex/remediate
        with:
          push-token: ${{ secrets.CI_PUSH_TOKEN }}

      - name: Scan with Trivy (high - informative)
        uses: ./.cicdeex/trivy
        with:
          image: socat-proxy:ci
          severity: HIGH
          exit-code: "0"

      - name: Publish tagged image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.cicdeex/publish
        with:
          image: socat-proxy:ci
          paths: '^(Dockerfile|entrypoint\.sh|VERSION)$'
          push-token: ${{ secrets.CI_PUSH_TOKEN }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          github-mirror: "true"
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Notify failures
        if: always()
        uses: ./.cicdeex/notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
